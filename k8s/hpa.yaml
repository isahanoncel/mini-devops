apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mini-api-hpa
  namespace: default

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mini-api

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120

    scaleUp:
      stabilizationWindowSeconds: 0
