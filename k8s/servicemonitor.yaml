apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mini-api-monitor
  namespace: default
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: mini-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s