name: CI - Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: mini-devops-production
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/isahanoncel/mini-devops:latest
            ghcr.io/isahanoncel/mini-devops:${{ github.sha }}

      - name: Update Kubernetes deployment annotation
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          sed -i \
            "s|deployment.kubernetes.io/build-sha:.*|deployment.kubernetes.io/build-sha: \"$BUILD_SHA\"|" \
            k8s/deployment.yaml

          echo "Updated deployment SHA:"
          grep "deployment.kubernetes.io/build-sha" k8s/deployment.yaml

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes"
            exit 0
          fi

          git commit -m "ci: deploy ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:master